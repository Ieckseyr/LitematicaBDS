[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-litematicabds"
version = "0.1.0"
description = "LitematicaBDS for Endstone: pure server-side litematic projection on top of HologramLib"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ieckseyr" }]
keywords = ["endstone", "plugin", "litematica", "schematic", "bedrock"]
dependencies = ["endstone>=0.11"]

[project.entry-points."endstone"]
litematicabds = "litematicabds_endstone:LitematicaBDSPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/litematicabds_endstone"]

[tool.hatch.build.targets.wheel.force-include]
"src/litematicabds_endstone/_native" = "litematicabds_endstone/_native"
